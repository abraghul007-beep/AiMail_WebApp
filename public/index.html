<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nebula Mail — AI Copilot</title><link rel="stylesheet" href="/styles.css"></head><body><div id="app"><aside class="sidebar"><div class="brand">✦ <span>Nebula Mail</span></div><button class="compose" onclick="compose()">＋ Compose</button><nav><button id="inboxNav" class="active" onclick="showFolder('INBOX')">⌂ Inbox</button><button id="sentNav" onclick="showFolder('SENT')">↗ Sent</button></nav><div class="tip"><b>AI Copilot</b><br><span>Ask me to compose, search, filter or open mail.</span></div></aside><main><header><div><h1 id="title">Inbox</h1><p id="count">Connect Gmail to get started.</p></div><div class="actions"><button onclick="toggleTheme()">◐</button><button onclick="refresh()">↻</button></div></header><section id="filters" class="filters"><input id="search" placeholder="Search mail…" oninput="debouncedLoad()"><select id="readFilter" onchange="loadMessages()"><option value="">All mail</option><option value="true">Unread</option></select><button onclick="lastDays(10)">Last 10 days</button></section><section id="content" class="content"></section></main><aside class="assistant"><div class="assistantHead"><div><b>✦ AI Copilot</b><small>UI control assistant</small></div><span class="dot"></span></div><div id="chat" class="chat"><div class="bubble bot">Hi! I can control your mail UI. Try:<br><br>“Show unread emails from this week”<br>“Open the latest email from David”<br>“Send an email to john@example.com…”</div></div><form class="prompt" onsubmit="ask(event)"><input id="prompt" autocomplete="off" placeholder="Tell me what to do…"><button>➤</button></form></aside></div><div id="modal"></div><script src="/app.js"></script></body></html>
